spring:
  application:
    name: swiftly-server
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:swiftly_db}
    username: ${DB_USERNAME:swiftly_user}
    password: ${DB_PASSWORD:swiftly_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  mvc:
    problemdetails:
      enabled: true

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  show-actuator: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /api-docs
  kotlin:
    return-nullable-as-required: true

internal:
  n8n:
    ingest-token: ${N8N_INGEST_TOKEN:}

storage:
  r2:
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    presigned-url-ttl: ${R2_PRESIGNED_URL_TTL:PT30M}
